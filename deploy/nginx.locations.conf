# Include inside the colorbook.pmg.dev server block after setting its root.
# TLS and the document-root path belong to the existing web-server setup.
index index.html;
autoindex off;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Next exports PNG images without an extension at these URLs.
location ~ /opengraph-image$ {
    default_type image/png;
    try_files $uri =404;
}

location / {
    # /277.html must win over the /277/ directory containing its share image.
    try_files $uri.html $uri $uri/ =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
}
